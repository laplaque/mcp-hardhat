[project]
name = "mcp-hardhat"
version = "0.1.0"
description = "Security-first MCP tooling: proxies, resilience wrappers, health monitors"
readme = "README.md"
license = "MPL-2.0"
authors = [
    { name = "laplaque" },
]
requires-python = ">=3.10"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "mypy>=1.8",
    "ruff>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.mypy]
strict = true
files = ["tools/", "tests/"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TC", "PLR"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "TC003"]

[tool.pytest]
testpaths = ["tests"]
